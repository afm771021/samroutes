<h2>Datos del servidor 2</h2>
<ul>
  <li *ngFor="let usuario of usuarios">
    {{usuario.EMP_ID}}-{{ usuario.FIRST_NAME }} {{ usuario.LAST_NAME }}
  </li>
</ul>

<ul *ngIf="datos$ | async as datos; else cargando">
  <li *ngFor="let item of datos">{{ item }}</li>
</ul>

<ng-template #cargando>
  <p>Cargando datos...</p>
</ng-template>
